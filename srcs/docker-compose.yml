networks:
  inception:
    name: "inception"
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind    
      device: ${HOME}/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

services:
  mariadb:
    container_name: mariadb
    build: ./Containers/MariaDB
    restart: on-failure
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    expose:
      - 3306
    secrets:
      - db_password
      - db_root_password

  wordpress:
    container_name: wordpress
    build: ./Containers/WordPress
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - 9000
      - 3306
    depends_on:
      - mariadb
  
  nginx:
    container_name: nginx
    build: ./Containers/NGINX
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - 9000
    ports:
      - 443:443
    depends_on:
      - mariadb
      - wordpress
