networks:
  inception:
    name: "inception"
    driver: bridge

secrets:
  wordpress:
    file: ../secrets/wordpress.txt
  mariadb:
    file: ../secrets/mariadb.txt

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind    
      device: ${HOME}/ulyildiz/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/ulyildiz/data/wordpress

services:
  mariadb:
    container_name: mariadb
    build: ./Containers/MariaDB
    image: srcs_mariadb:notlatest
    restart: on-failure
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    expose:
      - 3306
    secrets:
      - mariadb

  wordpress:
    container_name: wordpress
    build: ./Containers/WordPress
    image: srcs_wordpress:notlatest
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - 9000
    env_file:
      - ./Containers/.env
    secrets:
      - wordpress
      - mariadb
    depends_on:
      - mariadb
  
  nginx:
    container_name: nginx
    build: ./Containers/NGINX
    image: srcs_nginx:notlatest
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - 443:443
    env_file:
      - ./Containers.env
    depends_on:
      - mariadb
      - wordpress