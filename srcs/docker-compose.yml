networks:
  inception:
    name: "inception"
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wordpress:
    file: ../secrets/wordpress.txt
  mariadb:
    file: ../secrets/mariadb.txt
  nginx_domain:
    file: ../secrets/nginx.txt
  ssl_config:
    file: ../secrets/ssl_config.txt

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind    
      device: ${HOME}/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

services:
  mariadb:
    container_name: mariadb
    build: ./Containers/MariaDB
    restart: on-failure
    env_file:
      - ./Containers/MariaDB/.env
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    expose:
      - 3306
    secrets:
      - db_password
      - db_root_password
      - mariadb

  wordpress:
    container_name: wordpress
    build: ./Containers/WordPress
    restart: on-failure
    env_file:
      - ./Containers/WordPress/.env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - 9000
      - 3306
    secrets:
      - db_password
      - db_root_password
      - wordpress
      - mariadb
    depends_on:
      - mariadb
  
  nginx:
    container_name: nginx
    build: ./Containers/NGINX
    restart: on-failure
    env_file:
      - ./Containers/NGINX/.env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - 443
      - 9000
    ports:
      - 443:443
    secrets:
      - nginx_domain
      - ssl_config
    depends_on:
      - mariadb
      - wordpress